openapi: 3.1.0
info:
  title: openstash serve API
  version: 0.4.0
  description: HTTP API over the local openstash OpenAPI cache.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Liveness probe
      operationId: health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /v1/specs:
    get:
      summary: List stored specs
      operationId: listSpecs
      responses:
        "200":
          description: Stored spec entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/SpecEntry"
    post:
      summary: Ingest an OpenAPI document
      operationId: addSpec
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddSpecRequest"
      responses:
        "201":
          description: Spec stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddSpecResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/specs/{specKey}:
    get:
      summary: Dump latest stored version for a key
      operationId: dumpLatest
      parameters:
        - $ref: "#/components/parameters/specKey"
      responses:
        "200":
          description: Full OpenAPI document
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/specs/{specKey}/versions:
    get:
      summary: List stored versions for a key
      operationId: listVersions
      parameters:
        - $ref: "#/components/parameters/specKey"
      responses:
        "200":
          description: Version list
          content:
            application/json:
              schema:
                type: object
                required: [key, versions]
                properties:
                  key:
                    type: string
                  versions:
                    type: array
                    items:
                      type: string
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/specs/{specKey}/versions/{version}:
    get:
      summary: Dump a pinned spec version
      operationId: dumpVersion
      parameters:
        - $ref: "#/components/parameters/specKey"
        - $ref: "#/components/parameters/version"
      responses:
        "200":
          description: Full OpenAPI document
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/specs/{specKey}/versions/{version}/operations:
    get:
      summary: Search, show, or gather operations
      operationId: operations
      parameters:
        - $ref: "#/components/parameters/specKey"
        - $ref: "#/components/parameters/version"
        - name: detail
          in: query
          schema:
            type: string
            enum: [search, show, gather]
            default: search
        - name: q
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 5
        - name: pathPrefix
          in: query
          schema:
            type: string
        - name: method
          in: query
          schema:
            type: string
        - name: path
          in: query
          schema:
            type: string
        - name: depth
          in: query
          schema:
            type: integer
            default: 0
        - name: expand
          in: query
          schema:
            type: boolean
            default: false
        - name: in
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [paths, schemas]
      responses:
        "200":
          description: Operation results
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/specs/{specKey}/versions/{version}/schemas/{name}:
    get:
      summary: Show one component schema
      description: Mirrors `openstash schema`. $refs are inlined up to `depth` hops.
      operationId: getSchema
      parameters:
        - $ref: "#/components/parameters/specKey"
        - $ref: "#/components/parameters/version"
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: depth
          in: query
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: Resolved schema
          content:
            application/json:
              schema:
                type: object
                required: [ref, key, version, name, depth, schema]
                properties:
                  ref:
                    type: string
                  key:
                    type: string
                  version:
                    type: string
                  name:
                    type: string
                  depth:
                    type: integer
                  schema:
                    type: object
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/specs/{specKey}/timeline:
    get:
      summary: Version history with per-step change counts
      description: >-
        Lists every stored version of a key oldest to newest (semver order when
        versions parse) and a change summary between each consecutive pair.
      operationId: timeline
      parameters:
        - $ref: "#/components/parameters/specKey"
      responses:
        "200":
          description: Timeline
          content:
            application/json:
              schema:
                type: object
                required: [key, versions, steps]
                properties:
                  key:
                    type: string
                  versions:
                    type: array
                    items:
                      $ref: "#/components/schemas/TimelineVersion"
                  steps:
                    type: array
                    items:
                      type: object
                      required: [from, to, summary]
                      properties:
                        from:
                          type: string
                        to:
                          type: string
                        summary:
                          $ref: "#/components/schemas/CompareSummary"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/specs/{specKey}/compare:
    get:
      summary: Diff two stored versions of a key
      description: >-
        Like `openstash compare`, plus definition-level detection: operations whose
        parameters, requestBody, responses, deprecated or security differ are
        reported as changed (with an empty object under each changed field), and
        schemas whose raw definition differs get `definitionChanged: true`.
      operationId: compare
      parameters:
        - $ref: "#/components/parameters/specKey"
        - $ref: "#/components/parameters/from"
        - $ref: "#/components/parameters/to"
      responses:
        "200":
          description: Compare result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompareResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/specs/{specKey}/compare/definition:
    get:
      summary: Raw definition of one operation or schema in both versions
      description: >-
        Returns the raw operation (method + path) or component schema (schema)
        from both versions for line diffing. A side is null when the item does
        not exist in that version.
      operationId: compareDefinition
      parameters:
        - $ref: "#/components/parameters/specKey"
        - $ref: "#/components/parameters/from"
        - $ref: "#/components/parameters/to"
        - name: method
          in: query
          schema:
            type: string
        - name: path
          in: query
          schema:
            type: string
        - name: schema
          in: query
          description: Component schema name (instead of method + path)
          schema:
            type: string
      responses:
        "200":
          description: Both sides
          content:
            application/json:
              schema:
                type: object
                required: [key, from, to, item, baseline, target]
                properties:
                  key:
                    type: string
                  from:
                    type: string
                  to:
                    type: string
                  item:
                    type: object
                  baseline:
                    type: [object, "null"]
                  target:
                    type: [object, "null"]
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    from:
      name: from
      in: query
      required: true
      description: Baseline version
      schema:
        type: string
    to:
      name: to
      in: query
      required: true
      description: Target version
      schema:
        type: string
    specKey:
      name: specKey
      in: path
      required: true
      schema:
        type: string
    version:
      name: version
      in: path
      required: true
      schema:
        type: string
  schemas:
    SpecEntry:
      type: object
      properties:
        key:
          type: string
        version:
          type: string
        source:
          type: string
        endpoint:
          type: string
        fetchedAt:
          type: string
          format: date-time
        specVersion:
          type: string
    AddSpecRequest:
      type: object
      required: [key, from]
      properties:
        key:
          type: string
        from:
          type: string
          description: Source URL (http/https) or file path readable by the server
        version:
          type: string
        endpoint:
          type: string
          format: uri
    AddSpecResponse:
      type: object
      properties:
        status:
          type: string
        meta:
          type: object
        indexed:
          type: integer
        schemas:
          type: integer
    TimelineVersion:
      type: object
      required: [version, source, fetchedAt, operations, schemas]
      properties:
        version:
          type: string
        title:
          type: string
        infoVersion:
          type: string
        source:
          type: string
        fetchedAt:
          type: string
          format: date-time
        operations:
          type: integer
        schemas:
          type: integer
    CompareCounts:
      type: object
      required: [added, removed, changed, unchanged]
      properties:
        added:
          type: integer
        removed:
          type: integer
        changed:
          type: integer
        unchanged:
          type: integer
    CompareSummary:
      type: object
      required: [operations, schemas]
      properties:
        operations:
          $ref: "#/components/schemas/CompareCounts"
        schemas:
          $ref: "#/components/schemas/CompareCounts"
    CompareResult:
      type: object
      required: [baseline, target, summary, operations, schemas]
      properties:
        baseline:
          type: object
        target:
          type: object
        summary:
          $ref: "#/components/schemas/CompareSummary"
        operations:
          type: object
          description: added / removed (operation index entries) and changed ({method, path, changes})
        schemas:
          type: object
          description: added / removed (names) and changed ({name, fieldsAdded, fieldsRemoved, definitionChanged})
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Spec or operation not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Spec already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unprocessable:
      description: Invalid OpenAPI document
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
